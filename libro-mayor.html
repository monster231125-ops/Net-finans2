<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro Mayor — Finanzas Personales</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#171717">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Libro Mayor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#FAFAFA;
  --surface:#FFFFFF;
  --border:#E7E7E5;
  --border-strong:#D4D4D2;
  --ink:#171717;
  --ink-soft:#78716C;
  --ink-faint:#A8A29E;
  --accent:#D92D20;
  --accent-soft:#FBEAE8;
  --accent-hover:#B42318;
  --positive:#171717;
  --shadow: 0 1px 2px rgba(23,23,23,.04);
  --radius:10px;
  --radius-sm:7px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  letter-spacing:-.005em;
}
.mono{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;}
.serif{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:-.01em;}
::selection{background:var(--ink);color:#fff;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:var(--ink);}

/* ---------- LOCK SCREEN ---------- */
#lockScreen{
  position:fixed;inset:0;background:var(--ink);z-index:999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;
}
#lockScreen h1{font-family:'Inter',sans-serif;font-weight:700;font-size:24px;margin:0 0 4px;letter-spacing:-.02em;}
#lockScreen p{opacity:.6;margin:0 0 24px;font-size:13.5px;}
#lockPinInput{
  font-family:'Inter',sans-serif;font-size:26px;letter-spacing:10px;text-align:center;
  width:210px;padding:12px;border-radius:var(--radius-sm);border:1.5px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.06);color:#fff;
}
#lockPinInput:focus{outline:none;border-color:#fff;}
#lockError{color:#F5A199;font-size:12.5px;height:18px;margin-top:10px;}

/* ---------- SHELL ---------- */
.app-shell{display:block;min-height:100vh;}
.sidebar{
  background:var(--surface);color:var(--ink);padding:20px 0;position:fixed;top:0;left:0;height:100vh;width:224px;
  display:flex;flex-direction:column;border-right:1px solid var(--border);
  z-index:150;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 0 rgba(0,0,0,0);
}
.sidebar.open{transform:translateX(0);box-shadow:8px 0 24px rgba(23,23,23,.10);}
.sidebar-close{display:inline-flex;background:none;border:none;color:var(--ink-faint);font-size:15px;padding:4px 6px;border-radius:6px;}
.sidebar-close:hover{background:var(--bg);color:var(--ink);}
.sidebar-overlay{position:fixed;inset:0;background:rgba(23,23,23,.35);z-index:140;display:none;}
.sidebar-overlay.open{display:block;}
.menu-toggle{
  display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
  border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--radius-sm);
  font-size:16px;color:var(--ink);margin-bottom:14px;
}
.menu-toggle:hover{background:var(--bg);}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--border);margin-bottom:8px;}
.brand .mark{font-family:'Inter',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-.01em;}
.brand .sub{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-faint);margin-top:3px;}
.navtabs{list-style:none;margin:0;padding:0;flex:1;}
.navtabs li{position:relative;}
.navtabs button{
  width:100%;text-align:left;background:none;border:none;color:var(--ink-soft);
  padding:10px 20px 10px 17px;font-size:13.5px;display:flex;align-items:center;gap:10px;
  transition:background .12s,color .12s;border-left:2.5px solid transparent;font-weight:500;
}
.navtabs button:hover{background:var(--bg);color:var(--ink);}
.navtabs button.active{color:var(--ink);background:var(--bg);border-left:2.5px solid var(--accent);font-weight:600;}
.navtabs .num{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--ink-faint);width:14px;}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--ink-faint);}
.sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;background:var(--ink);}
.sync-dot.off{background:var(--accent);}

main{padding:26px 34px 100px;max-width:1180px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.topbar h1{font-family:'Inter',sans-serif;font-weight:700;font-size:23px;margin:0;letter-spacing:-.02em;}
.topbar .eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px;}

.banner{background:var(--accent-soft);border:1px solid #F3C6C1;border-radius:var(--radius-sm);padding:11px 16px;font-size:13px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#7A241A;}
.banner button{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
.grid{display:grid;gap:14px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:1fr 1fr;}
@media(max-width:880px){.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px;font-weight:600;}
.stat-value{font-family:'Inter',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.02em;}
.stat-value.pos{color:var(--ink);}
.stat-value.neg{color:var(--accent);}
.stat-sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}

.section{display:none;}
.section.active{display:block;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

h2.section-title{font-family:'Inter',sans-serif;font-weight:700;font-size:16px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);letter-spacing:-.01em;}
h2.section-title:first-child{margin-top:0;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;letter-spacing:.1px;}
.btn:hover{background:#000;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border-strong);}
.btn.ghost:hover{background:var(--bg);}
.btn.danger{background:var(--accent);}
.btn.danger:hover{background:var(--accent-hover);}
.btn.small{padding:6px 11px;font-size:12px;}
.btn.brass{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);}
.btn.brass:hover{background:var(--bg);}
.icon-btn{background:none;border:none;font-size:14px;padding:4px 6px;color:var(--ink-faint);border-radius:var(--radius-sm);}
.icon-btn:hover{background:var(--bg);color:var(--ink);}

/* Table */
table.ledger{width:100%;border-collapse:collapse;font-size:13.5px;}
table.ledger thead th{text-align:left;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--border-strong);font-weight:600;}
table.ledger tbody td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.ledger tbody tr:hover{background:var(--bg);}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;}
.amt{font-family:'Inter',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;}
.amt.pos{color:var(--ink);}
.amt.neg{color:var(--accent);}

/* Progress bars */
.progress-track{background:var(--bg);border:1px solid var(--border);border-radius:20px;height:8px;overflow:hidden;}
.progress-fill{height:100%;transition:width .3s;}
.progress-fill.green{background:var(--ink);}
.progress-fill.yellow{background:#9A9A96;}
.progress-fill.red{background:var(--accent);}

/* Status badges (antes "sello") */
.stamp{display:inline-block;border-radius:5px;padding:2px 8px;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:var(--bg);}
.stamp.pagado{color:var(--ink);background:var(--bg);}
.stamp.pendiente{color:#8A6D00;background:#FBF2D6;}
.stamp.vencido{color:var(--accent);background:var(--accent-soft);}

/* FAB */
.fabs{position:fixed;bottom:26px;right:28px;display:flex;flex-direction:column;gap:10px;z-index:60;}
.fab{
  width:auto;padding:13px 20px;border-radius:50px;border:none;
  font-weight:600;font-size:13px;letter-spacing:.2px;color:#fff;
  box-shadow:0 4px 14px rgba(23,23,23,.18);display:flex;align-items:center;gap:8px;
}
.fab.income{background:var(--ink);}
.fab.expense{background:var(--accent);}
.fab.transfer{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);box-shadow:0 4px 14px rgba(23,23,23,.10);}
.fab:hover{transform:translateY(-1px);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(23,23,23,.4);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:12px;max-width:480px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.18);border:1px solid var(--border);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
.modal-head h3{margin:0;font-family:'Inter',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-.01em;}
.modal-body{padding:18px 20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:#fff;font-size:14px;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.type-toggle{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;}
.type-toggle button{flex:1;padding:9px;border:none;background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);}
.type-toggle button.active.ingreso{background:var(--bg);color:var(--ink);}
.type-toggle button.active.egreso{background:var(--accent-soft);color:var(--accent);}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border-strong);background:#fff;font-size:12.5px;}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.empty{padding:30px 10px;text-align:center;color:var(--ink-faint);font-size:13.5px;}
.subtabs{display:flex;gap:6px;margin-bottom:14px;}
.subtabs button{padding:8px 14px;border-radius:20px;border:1px solid var(--border-strong);background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);}
.subtabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.alert-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.alert-item:last-child{border:none;}

/* Calendario */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;margin-bottom:4px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-cell{aspect-ratio:1;border:1px solid transparent;border-radius:8px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:var(--ink);padding:2px;font-family:inherit;}
.cal-cell.empty{visibility:hidden;}
.cal-cell:not(.empty):hover{background:var(--bg);}
.cal-cell.today .cal-daynum{font-weight:700;text-decoration:underline;text-underline-offset:3px;}
.cal-cell.selected{background:var(--ink);}
.cal-cell.selected .cal-daynum{color:#fff;}
.cal-dots{display:flex;gap:2px;height:6px;align-items:center;}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--ink-faint);flex-shrink:0;}
.cal-dot.deuda,.cal-dot.tarjeta-pago{background:var(--accent);}
.cal-dot.cobro{background:var(--ink-faint);}
.cal-dot.recurrente{background:var(--ink);}
.cal-dot.tarjeta-corte{background:var(--border-strong);}
.cal-detail-empty{font-size:12.5px;color:var(--ink-faint);padding:4px 2px 0;}
.cal-detail-title{font-size:11.5px;font-weight:700;margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--border);}

/* Ayuda */
.help-item{border-bottom:1px solid var(--border);}
.help-item:last-child{border-bottom:none;}
.help-q{cursor:pointer;font-size:14px;font-weight:600;padding:13px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.help-q::-webkit-details-marker{display:none;}
.help-q::after{content:'+';font-size:18px;color:var(--ink-faint);font-weight:400;flex-shrink:0;}
.help-item[open] .help-q::after{content:'−';}
.help-a{font-size:13.5px;color:var(--ink-soft);line-height:1.65;padding:0 0 15px;}
.help-a b{color:var(--ink);}
.thumb{width:32px;height:32px;object-fit:cover;border-radius:5px;border:1px solid var(--border);cursor:pointer;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:400;box-shadow:0 8px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.trend{font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;}
.trend.up{background:var(--accent-soft);color:var(--accent);}
.trend.down{background:var(--bg);color:var(--ink);}
@media print{
  .sidebar,.fabs,.topbar .btn,.no-print{display:none !important;}
  .app-shell{display:block;}
  main{padding:0;max-width:100%;}
  body{background:#fff;}
}
</style>
</head>
<body>

<div id="lockScreen" style="display:none;">
  <h1>Libro Mayor</h1>
  <p>Ingresa tu PIN para continuar</p>
  <input id="lockPinInput" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
  <div id="lockError"></div>
</div>

<div class="app-shell" id="appShell" style="display:none;">
  <nav class="sidebar" id="sidebarNav">
    <div class="brand" style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div class="mark">Libro Mayor</div>
        <div class="sub">Finanzas personales</div>
      </div>
      <button class="sidebar-close" id="sidebarCloseBtn" onclick="closeSidebar()">✕</button>
    </div>
    <ul class="navtabs" id="navTabs">
      <li><button data-section="inicio" class="active"><span class="num">01</span> Inicio</button></li>
      <li><button data-section="transacciones"><span class="num">02</span> Transacciones</button></li>
      <li><button data-section="deudas"><span class="num">03</span> Deudas</button></li>
      <li><button data-section="presupuestos"><span class="num">04</span> Presupuestos y Metas</button></li>
      <li><button data-section="tarjetas"><span class="num">05</span> Tarjetas de Crédito</button></li>
      <li><button data-section="creditos"><span class="num">06</span> Créditos</button></li>
      <li><button data-section="reportes"><span class="num">07</span> Reportes</button></li>
      <li><button data-section="ajustes"><span class="num">08</span> Ajustes</button></li>
      <li><button data-section="ayuda"><span class="num">09</span> Ayuda</button></li>
    </ul>
    <div class="sidebar-foot"><span class="sync-dot off" id="syncDot"></span><span id="syncLabel">Sin conectar a Sheets</span></div>
  </nav>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <main>
    <button class="menu-toggle no-print" id="menuToggleBtn" onclick="openSidebar()">☰</button>
    <div class="banner" id="offlineBanner" style="display:none;background:var(--bg);border-color:var(--border-strong);color:var(--ink);">
      <span id="offlineBannerText"></span>
      <button style="background:var(--ink);" onclick="syncFromSheets(true)">Reintentar</button>
    </div>
    <div class="banner" id="setupBanner" style="display:none;">
      <span>🔧 Aún no conectas Google Sheets — tus datos solo viven en esta sesión y se perderán al recargar. Configúralo en Ajustes.</span>
      <button onclick="showSection('ajustes')">Ir a Ajustes</button>
    </div>
    <div class="banner" id="recurBanner" style="display:none;background:var(--bg);border-color:var(--border-strong);color:var(--ink);">
      <span id="recurBannerText"></span>
      <button style="background:var(--ink);" onclick="aplicarRecurrentesPendientes()">Aplicar ahora</button>
    </div>

    <div id="sec-inicio" class="section active"></div>
    <div id="sec-transacciones" class="section"></div>
    <div id="sec-deudas" class="section"></div>
    <div id="sec-presupuestos" class="section"></div>
    <div id="sec-tarjetas" class="section"></div>
    <div id="sec-creditos" class="section"></div>
    <div id="sec-reportes" class="section"></div>
    <div id="sec-ajustes" class="section"></div>
    <div id="sec-ayuda" class="section"></div>
  </main>
</div>

<div class="fabs no-print" id="fabs" style="display:none;">
  <button class="fab income" onclick="openTxModal('ingreso')">＋ Ingreso</button>
  <button class="fab expense" onclick="openTxModal('egreso')">－ Egreso</button>
  <button class="fab transfer" onclick="openTransferModal()">⇄ Transferencia</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   LIBRO MAYOR — lógica de la aplicación
   ============================================================ */

const ENTIDADES = ['cuentas','categorias','transacciones','deudas','abonosDeuda','cuentasCobrar','presupuestos','metas','recurrentes','tarjetas','transferencias','estadosCuenta','comprasMeses'];

const CATEGORIAS_DEFECTO = [
  {nombre:'Salario', tipo:'ingreso', icono:'💰', color:'#171717'},
  {nombre:'Freelance', tipo:'ingreso', icono:'🧾', color:'#52525B'},
  {nombre:'Otros ingresos', tipo:'ingreso', icono:'➕', color:'#A1A1AA'},
  {nombre:'Alimentos', tipo:'egreso', icono:'🍽️', color:'#292524'},
  {nombre:'Transporte', tipo:'egreso', icono:'🚌', color:'#57534E'},
  {nombre:'Vivienda', tipo:'egreso', icono:'🏠', color:'#78716C'},
  {nombre:'Servicios', tipo:'egreso', icono:'💡', color:'#A8A29E'},
  {nombre:'Entretenimiento', tipo:'egreso', icono:'🎬', color:'#D92D20'},
  {nombre:'Salud', tipo:'egreso', icono:'⚕️', color:'#44403C'},
  {nombre:'Educación', tipo:'egreso', icono:'📚', color:'#8A8781'},
  {nombre:'Otros gastos', tipo:'egreso', icono:'📌', color:'#D4D4D2'}
];
const CUENTAS_DEFECTO = [
  {nombre:'Efectivo', tipo:'efectivo', saldoInicial:0},
  {nombre:'Cuenta Bancaria', tipo:'banco', saldoInicial:0},
  {nombre:'Tarjeta de Crédito', tipo:'credito', saldoInicial:0}
];
const MONEDAS = {USD:'$',MXN:'$',EUR:'€',COP:'$',ARS:'$',PEN:'S/',CLP:'$',GTQ:'Q',HNL:'L',UYU:'$U',BOB:'Bs'};

let STATE = {
  apiUrl:'', currency:'USD', pin:null, unlocked:false,
  cuentas:[], categorias:[], transacciones:[], deudas:[], abonosDeuda:[], cuentasCobrar:[], presupuestos:[], metas:[], recurrentes:[], tarjetas:[], transferencias:[], estadosCuenta:[], comprasMeses:[]
};
let currentSection = 'inicio';
let charts = {};

/* ---------------- Caché local del dispositivo ----------------
   Dentro de Claude.ai la app usa window.storage (memoria de artefactos).
   Si instalas/hospedas este archivo fuera de Claude.ai (ver INSTRUCCIONES.md),
   window.storage no existe y esta capa usa localStorage automáticamente,
   lo cual además es lo que permite que la app funcione sin conexión. */
const LocalCache = (function(){
  let disponible = false;
  try{ localStorage.setItem('__lm_test__','1'); localStorage.removeItem('__lm_test__'); disponible = true; }catch(e){ disponible = false; }
  return {
    disponible,
    get(key){ if(!disponible) return null; try{ return localStorage.getItem('lm_'+key); }catch(e){ return null; } },
    set(key, value){ if(!disponible) return; try{ localStorage.setItem('lm_'+key, value); }catch(e){} }
  };
})();

/* ---------------- Config persistente (window.storage + respaldo local) ---------------- */
function aplicarConfig(cfg){
  STATE.apiUrl = cfg.apiUrl || '';
  STATE.currency = cfg.currency || 'USD';
  STATE.pin = cfg.pin || null;
}
async function loadConfig(){
  try{
    if(window.storage){
      const r = await window.storage.get('config');
      if(r && r.value){ aplicarConfig(JSON.parse(r.value)); return; }
    }
  }catch(e){ /* sin config previa en window.storage */ }
  const cached = LocalCache.get('config');
  if(cached){ try{ aplicarConfig(JSON.parse(cached)); }catch(e){} }
}
async function saveConfig(){
  const cfg = {apiUrl:STATE.apiUrl, currency:STATE.currency, pin:STATE.pin};
  const json = JSON.stringify(cfg);
  try{ if(window.storage) await window.storage.set('config', json); }catch(e){ console.error('No se pudo guardar config en window.storage', e); }
  LocalCache.set('config', json);
}

/* ---------------- Utilidades ---------------- */
function uid(){ return 'local_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtMoney(n){
  const sym = MONEDAS[STATE.currency] || '$';
  const v = Number(n||0);
  const s = v.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (v<0? '-' : '') + sym + Math.abs(v).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(dateStr){ return (dateStr||'').slice(0,7); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function catByName(nombre){ return STATE.categorias.find(c=>c.nombre===nombre); }
function cuentaByName(nombre){ return STATE.cuentas.find(c=>c.nombre===nombre); }

/* ---------------- Capa API (Google Sheets Apps Script) ---------------- */
const API = {
  async ping(url){
    try{
      const res = await fetch(url + '?action=ping');
      const j = await res.json();
      return j.ok === true;
    }catch(e){ return false; }
  },
  async listAll(){
    if(!STATE.apiUrl) return null;
    const res = await fetch(STATE.apiUrl + '?action=listAll');
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'Error al listar');
    return j.data;
  },
  async create(entity, data){
    if(!STATE.apiUrl){
      data.id = data.id || uid();
      data.creado = data.creado || new Date().toISOString();
      STATE[entity].push(data);
      return data;
    }
    try{
      const res = await fetch(STATE.apiUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'create', entity, data})});
      const j = await res.json();
      if(!j.ok) throw new Error(j.error||'Error al crear');
      STATE[entity].push(j.data);
      return j.data;
    }catch(e){
      toast('No se pudo guardar en Google Sheets: '+e.message);
      throw e;
    }
  },
  async update(entity, id, data){
    const idx = STATE[entity].findIndex(r=>r.id===id);
    if(!STATE.apiUrl){
      if(idx>-1) STATE[entity][idx] = Object.assign({}, STATE[entity][idx], data);
      return STATE[entity][idx];
    }
    // Si el registro se creó ANTES de conectar Google Sheets (id local, nunca llegó
    // a la hoja), no existe ahí para "actualizar" — hay que crearlo en su lugar.
    if(String(id).indexOf('local_')===0){
      const base = idx>-1 ? STATE[entity][idx] : {};
      const merged = Object.assign({}, base, data);
      delete merged.id;
      try{
        const nuevo = await API.create(entity, merged);
        if(idx>-1) STATE[entity].splice(idx,1);
        toast('Este registro no estaba sincronizado — se guardó como nuevo en Google Sheets ✓');
        return nuevo;
      }catch(e){
        toast('No se pudo guardar en Google Sheets: '+e.message);
        throw e;
      }
    }
    try{
      const res = await fetch(STATE.apiUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'update', entity, id, data})});
      const j = await res.json();
      if(!j.ok){
        toast('No se pudo actualizar: el registro no se encontró en tu Google Sheet (revisa que no lo hayas borrado o renombrado ahí manualmente).');
        throw new Error(j.error||'No se encontró el registro en la hoja');
      }
      if(idx>-1) STATE[entity][idx] = j.data;
      return j.data;
    }catch(e){
      if(!/no se encontr/.test(e.message)) toast('No se pudo actualizar en Google Sheets: '+e.message);
      throw e;
    }
  },
  async remove(entity, id){
    const idx = STATE[entity].findIndex(r=>r.id===id);
    if(idx>-1) STATE[entity].splice(idx,1);
    if(!STATE.apiUrl || String(id).indexOf('local_')===0) return true;
    try{
      const res = await fetch(STATE.apiUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'delete', entity, id})});
      const j = await res.json();
      if(!j.ok) toast('No se pudo eliminar de Google Sheets — puede que ya no exista ahí.');
      return j.ok;
    }catch(e){
      toast('No se pudo eliminar en Google Sheets: '+e.message);
      return false;
    }
  }
};

async function syncFromSheets(showToast){
  if(!STATE.apiUrl){ setSyncStatus(false); return; }
  try{
    const data = await API.listAll();
    ENTIDADES.forEach(e=>{ STATE[e] = (data && data[e]) || []; });
    setSyncStatus(true);
    guardarCopiaOffline();
    if(showToast) toast('Datos sincronizados con Google Sheets ✓');
  }catch(e){
    setSyncStatus(false);
    const cargoOffline = cargarCopiaOffline();
    if(cargoOffline){ toast('Sin conexión — mostrando la última copia guardada en este dispositivo'); }
    else if(showToast){ toast('No se pudo sincronizar: '+e.message); }
  }
}
function guardarCopiaOffline(){
  const snap = {}; ENTIDADES.forEach(e=>snap[e]=STATE[e]);
  LocalCache.set('offlineSnapshot', JSON.stringify(snap));
  LocalCache.set('offlineSnapshotTime', new Date().toISOString());
}
function cargarCopiaOffline(){
  const raw = LocalCache.get('offlineSnapshot');
  if(!raw) return false;
  try{
    const snap = JSON.parse(raw);
    ENTIDADES.forEach(e=>{ STATE[e] = snap[e] || []; });
    const t = LocalCache.get('offlineSnapshotTime');
    const banner = document.getElementById('offlineBanner');
    if(banner){ banner.style.display='flex'; document.getElementById('offlineBannerText').textContent = '📴 Sin conexión — viendo datos guardados el '+ (t? fmtDate(t):'—') +' en este dispositivo.'; }
    return true;
  }catch(e){ return false; }
}
function setSyncStatus(ok){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  const banner = document.getElementById('setupBanner');
  if(!dot) return;
  if(!STATE.apiUrl){
    dot.className='sync-dot off'; label.textContent='Sin conectar a Sheets'; banner.style.display='flex';
  }else if(ok){
    dot.className='sync-dot'; label.textContent='Conectado a Google Sheets'; banner.style.display='none';
    const ob = document.getElementById('offlineBanner'); if(ob) ob.style.display='none';
  }else{
    dot.className='sync-dot off'; label.textContent='Error de conexión'; banner.style.display='flex';
  }
}

   ============================================================ */
function calcBalance(){
  let ingresos=0, egresos=0;
  STATE.transacciones.forEach(t=>{
    const m = parseFloat(t.monto)||0;
    if(t.tipo==='ingreso') ingresos+=m; else egresos+=m;
  });
  const saldosIniciales = STATE.cuentas.reduce((a,c)=>a+(parseFloat(c.saldoInicial)||0),0);
  return {balance: saldosIniciales+ingresos-egresos, ingresos, egresos};
}
function calcSaldoCuenta(nombreCuenta){
  const cuenta = cuentaByName(nombreCuenta);
  let saldo = cuenta? (parseFloat(cuenta.saldoInicial)||0) : 0;
  STATE.transacciones.forEach(t=>{
    if(t.cuenta!==nombreCuenta) return;
    const m = parseFloat(t.monto)||0;
    saldo += t.tipo==='ingreso'? m : -m;
  });
  STATE.transferencias.forEach(tr=>{
    const m = parseFloat(tr.monto)||0;
    if(tr.cuentaDestino===nombreCuenta) saldo += m;
    if(tr.cuentaOrigen===nombreCuenta) saldo -= m;
  });
  return saldo;
}
function txDelMes(offsetMeses){
  offsetMeses = offsetMeses||0;
  const d = new Date(); d.setMonth(d.getMonth()+offsetMeses);
  const key = d.toISOString().slice(0,7);
  return STATE.transacciones.filter(t=>monthKey(t.fecha)===key);
}
function calcDeudaTotal(){
  let deudas=0, tarjetas=0, creditos=0;
  STATE.deudas.forEach(d=>{ deudas += Math.max(0, parseFloat(d.saldoRestante)||0); });
  STATE.tarjetas.forEach(t=>{
    const cicloCalc = calcularGastoCicloTarjeta(t);
    const saldo = Math.max(0, cicloCalc!==null ? cicloCalc : (parseFloat(t.saldoActual)||0));
    if(grupoDeTipo(t.tipo)==='tarjeta') tarjetas += saldo; else creditos += saldo;
  });
  return {total: deudas+tarjetas+creditos, deudas, tarjetas, creditos};
}
function calcDisponibleHoy(){
  const mesActual = todayISO().slice(0,7);
  const presMes = STATE.presupuestos.filter(p=>p.mes===mesActual);
  if(presMes.length===0) return null;
  let totalLimite=0, totalGastado=0;
  const txMes = txDelMes(0).filter(t=>t.tipo==='egreso');
  presMes.forEach(p=>{
    totalLimite += parseFloat(p.limite)||0;
    totalGastado += txMes.filter(t=>t.categoria===p.categoria).reduce((a,t)=>a+(parseFloat(t.monto)||0),0);
  });
  const hoy = new Date();
  const diasEnMes = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0).getDate();
  const diasRestantes = Math.max(1, diasEnMes - hoy.getDate() + 1);
  const restante = totalLimite - totalGastado;
  return {
    restante, diasRestantes, totalLimite, totalGastado,
    disponibleHoy: Math.max(0, restante)/diasRestantes,
    sobregirado: restante < 0
  };
}

function renderPieChart(txMes){
  const gastos = {};
  txMes.filter(t=>t.tipo==='egreso').forEach(t=>{
    gastos[t.categoria] = (gastos[t.categoria]||0) + (parseFloat(t.monto)||0);
  });
  const labels = Object.keys(gastos);
  const ctx = document.getElementById('chartPie');
  if(charts.pie) charts.pie.destroy();
  if(labels.length===0){ ctx.parentElement.querySelector('.stat-label').insertAdjacentHTML('afterend','<div class="empty">Aún no hay gastos registrados este mes.</div>'); return; }
  const colors = labels.map(l=> (catByName(l)||{}).color || '#6B6558');
  charts.pie = new Chart(ctx, {
    type:'doughnut',
    data:{labels, datasets:[{data:labels.map(l=>gastos[l]), backgroundColor:colors, borderColor:'#FFFFFF', borderWidth:2}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:11, font:{size:11}}}}, cutout:'62%'}
  });
}
function renderBarChart(){
  const meses = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setMonth(d.getMonth()-i);
    meses.push(d.toISOString().slice(0,7));
  }
  const ing = meses.map(k=> STATE.transacciones.filter(t=>t.tipo==='ingreso' && monthKey(t.fecha)===k).reduce((a,t)=>a+(parseFloat(t.monto)||0),0));
  const egr = meses.map(k=> STATE.transacciones.filter(t=>t.tipo==='egreso' && monthKey(t.fecha)===k).reduce((a,t)=>a+(parseFloat(t.monto)||0),0));
  const labels = meses.map(k=>{ const [y,m]=k.split('-'); return new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'short'}); });
  const ctx = document.getElementById('chartBar');
  if(charts.bar) charts.bar.destroy();
  charts.bar = new Chart(ctx, {
    type:'bar',
    data:{labels, datasets:[
      {label:'Ingresos', data:ing, backgroundColor:'#171717', borderRadius:4},
      {label:'Egresos', data:egr, backgroundColor:'#D92D20', borderRadius:4}
    ]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:11,font:{size:11}}}}, scales:{y:{beginAtZero:true}}}
  });
}
function renderAlertas(){
  const hoy = new Date(); const limite = new Date(); limite.setDate(hoy.getDate()+7);
  const items = [];
  STATE.deudas.forEach(d=>{
    if(d.fechaLimite && parseFloat(d.saldoRestante)>0){
      const f = new Date(d.fechaLimite);
      if(f<=limite){ items.push({texto:`Deuda con ${d.acreedor}: ${fmtMoney(d.saldoRestante)}`, fecha:d.fechaLimite, vencido:f<hoy}); }
    }
  });
  STATE.cuentasCobrar.forEach(c=>{
    if(c.fechaCompromiso && c.estado!=='pagado'){
      const f = new Date(c.fechaCompromiso);
      if(f<=limite){ items.push({texto:`${c.deudor} te debe ${fmtMoney(c.monto)}`, fecha:c.fechaCompromiso, vencido:f<hoy}); }
    }
  });
  STATE.recurrentes.forEach(r=>{
    if(r.activo!==false && r.proximaFecha){
      const f = new Date(r.proximaFecha);
      if(f<=limite){ items.push({texto:`Recurrente: ${r.nota||r.categoria} (${fmtMoney(r.monto)})`, fecha:r.proximaFecha, vencido:f<hoy}); }
    }
  });
  STATE.tarjetas.forEach(t=>{
    if(t.diaPago){
      const f = nextOccurrenceOfDay(t.diaPago);
      if(f<=limite){ items.push({texto:`Pago de tarjeta ${t.nombre}`, fecha:f.toISOString().slice(0,10), vencido:false}); }
    }
  });
  items.sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));
  const cont = document.getElementById('alertList');
  if(items.length===0){ cont.innerHTML = '<div class="empty">No tienes pagos ni cobros próximos. 🎉</div>'; return; }
  cont.innerHTML = items.map(i=>`<div class="alert-item"><span>${i.vencido?'🔴':'🟡'} ${escapeHtml(i.texto)}</span><span class="mono" style="color:${i.vencido?'var(--accent)':'var(--ink-soft)'}">${fmtDate(i.fecha)}</span></div>`).join('');
}

function calcEventosDeHoy(){
  const hoy = todayISO();
  const items = [];
  STATE.deudas.forEach(d=>{
    if(d.fechaLimite===hoy && parseFloat(d.saldoRestante)>0){
      items.push({texto:`Vence tu deuda con ${d.acreedor}: ${fmtMoney(d.saldoRestante)}`, tipo:'deuda'});
    }
  });
  STATE.cuentasCobrar.forEach(c=>{
    if(c.fechaCompromiso===hoy && c.estado!=='pagado'){
      items.push({texto:`${c.deudor} quedó de pagarte hoy: ${fmtMoney(c.monto)}`, tipo:'cobro'});
    }
  });
  STATE.recurrentes.forEach(r=>{
    if(r.activo!==false && r.proximaFecha===hoy){
      items.push({texto:`${r.tipo==='ingreso'?'Ingreso recurrente hoy':'Pago recurrente hoy'}: ${r.nota||r.categoria} (${fmtMoney(r.monto)})`, tipo:'recurrente'});
    }
  });
  STATE.tarjetas.forEach(t=>{

/* ---------------- Calendario de pagos ---------------- */
let calState = null;
function ensureCalState(){
  if(!calState){
    const t = new Date();
    calState = {year:t.getFullYear(), month:t.getMonth(), selected: todayISO()};
  }
}
function isoDate(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function buildEventsForMonth(year, month){
  const events = {};
  function addEvent(dateISO, texto, tipo){
    if(!dateISO) return;
    if(!events[dateISO]) events[dateISO]=[];
    events[dateISO].push({texto, tipo});
  }
  const daysInMonth = new Date(year, month+1, 0).getDate();
  STATE.deudas.forEach(d=>{
    if(d.fechaLimite && parseFloat(d.saldoRestante)>0){
      const f = new Date(d.fechaLimite);
      if(f.getFullYear()===year && f.getMonth()===month) addEvent(d.fechaLimite, `Deuda: ${d.acreedor} (${fmtMoney(d.saldoRestante)})`, 'deuda');
    }
  });
  STATE.cuentasCobrar.forEach(c=>{
    if(c.fechaCompromiso && c.estado!=='pagado'){
      const f = new Date(c.fechaCompromiso);
      if(f.getFullYear()===year && f.getMonth()===month) addEvent(c.fechaCompromiso, `Te debe: ${c.deudor} (${fmtMoney(c.monto)})`, 'cobro');
    }
  });
  STATE.recurrentes.forEach(r=>{
    if(r.activo!==false && r.proximaFecha){
      const f = new Date(r.proximaFecha);
      if(f.getFullYear()===year && f.getMonth()===month) addEvent(r.proximaFecha, `${r.tipo==='ingreso'?'Ingreso recurrente':'Pago recurrente'}: ${r.nota||r.categoria} (${fmtMoney(r.monto)})`, 'recurrente');
    }
  });
  STATE.tarjetas.forEach(t=>{
    if(t.diaPago){
      const dia = Math.min(parseInt(t.diaPago)||1, daysInMonth);
      addEvent(isoDate(year,month,dia), `Límite de pago: ${t.nombre}`, 'tarjeta-pago');
    }
    if(t.diaCorte){
      const dia = Math.min(parseInt(t.diaCorte)||1, daysInMonth);
      addEvent(isoDate(year,month,dia), `Corte de tarjeta: ${t.nombre}`, 'tarjeta-corte');
    }
  });
  return events;
}
function renderCalendarCard(){
  ensureCalState();
  const wrap = document.getElementById('calendarWrap');
  if(!wrap) return;
  const {year, month} = calState;
  const events = buildEventsForMonth(year, month);
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = new Date(year,month,1).toLocaleDateString('es-ES',{month:'long', year:'numeric'});
  let cells = '';
  for(let i=0;i<firstDay;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = isoDate(year,month,d);
    const dayEvents = events[iso]||[];
    const isToday = iso===todayISO();
    const isSelected = iso===calState.selected;
    const dots = dayEvents.slice(0,4).map(e=>`<span class="cal-dot ${e.tipo}"></span>`).join('');
    cells += `<button class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectCalDay('${iso}')">
      <span class="cal-daynum">${d}</span>
      <span class="cal-dots">${dots}</span>
    </button>`;
  }
  wrap.innerHTML = `
    <div class="cal-header">
      <button class="icon-btn" onclick="calMonthNav(-1)">‹</button>
      <span style="font-weight:600;font-size:13.5px;text-transform:capitalize;">${monthLabel}</span>
      <button class="icon-btn" onclick="calMonthNav(1)">›</button>
    </div>
    <div class="cal-weekdays">${['D','L','M','M','J','V','S'].map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div id="calDayDetail"></div>`;
  renderCalDayDetail(events);
}
function calMonthNav(delta){
  ensureCalState();
  let m = calState.month+delta, y = calState.year;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  calState.month=m; calState.year=y;
  renderCalendarCard();
}
function selectCalDay(iso){ calState.selected = iso; renderCalendarCard(); }
function renderCalDayDetail(events){
  const list = events[calState.selected]||[];
  const cont = document.getElementById('calDayDetail');
  if(!cont) return;
  const label = new Date(calState.selected+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'});
  if(list.length===0){ cont.innerHTML = `<div class="cal-detail-title" style="text-transform:capitalize;">${label}</div><div class="cal-detail-empty">Sin eventos este día.</div>`; return; }
  cont.innerHTML = `<div class="cal-detail-title" style="text-transform:capitalize;">${label}</div>` +
    list.map(e=>`<div class="alert-item"><span><span class="cal-dot ${e.tipo}" style="margin-right:6px;"></span>${escapeHtml(e.texto)}</span></div>`).join('');
}

function handleFotoUpload(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = function(e){
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxW = 480;
      const scale = Math.min(1, maxW/img.width);
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      txFotoData = canvas.toDataURL('image/jpeg', 0.55);
      document.getElementById('fotoPreviewWrap').innerHTML = `<img src="${txFotoData}" style="width:70px;border-radius:6px;">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  await API.update('recurrentes', id, {activo: r.activo===false});

}
async function deleteRecurrente(id){
  if(!confirm('¿Eliminar este recurrente?')) return;
  await API.remove('recurrentes', id); renderRecurTable();
}
function avanzarFecha(fecha, frecuencia){
  const d = new Date(fecha);
  if(frecuencia==='semanal') d.setDate(d.getDate()+7);
  else if(frecuencia==='anual') d.setFullYear(d.getFullYear()+1);
  else d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function checkRecurrentesPendientes(){
  const hoy = todayISO();
  const pendientes = STATE.recurrentes.filter(r=>r.activo!==false && r.proximaFecha && r.proximaFecha<=hoy);
  const banner = document.getElementById('recurBanner');
  if(pendientes.length>0){
    banner.style.display='flex';
    document.getElementById('recurBannerText').textContent = `Tienes ${pendientes.length} movimiento(s) recurrente(s) listos para aplicar.`;
  }else{ banner.style.display='none'; }
}
async function aplicarRecurrentesPendientes(){
  const hoy = todayISO();
  const pendientes = STATE.recurrentes.filter(r=>r.activo!==false && r.proximaFecha && r.proximaFecha<=hoy);
  for(const r of pendientes){
    await API.create('transacciones', {tipo:r.tipo, monto:r.monto, categoria:r.categoria, fecha:r.proximaFecha, cuenta:r.cuenta, nota:'(Recurrente) '+(r.nota||''), foto:''});
    await API.update('recurrentes', r.id, {proximaFecha: avanzarFecha(r.proximaFecha, r.frecuencia)});
  }
  toast(pendientes.length+' movimiento(s) aplicado(s) ✓');
  document.getElementById('recurBanner').style.display='none';
  if(currentSection==='transacciones'){ renderTxTable(); renderRecurTable(); }
  if(currentSection==='inicio') renderInicio();
}

  otra_tarjeta:     {label:'Otra tarjeta de crédito', icono:'💳', cuotas:false, grupo:'tarjeta'},
  credito_tienda:   {label:'Crédito de tienda departamental', icono:'🛍️', cuotas:false, grupo:'credito'},
  prestamo:         {label:'Préstamo personal', icono:'💵', cuotas:true, grupo:'credito'},
  automotriz:       {label:'Crédito automotriz', icono:'🚗', cuotas:true, grupo:'credito'},
  hipoteca:         {label:'Hipoteca', icono:'🏠', cuotas:true, grupo:'credito'},
  otro:             {label:'Otro crédito', icono:'📄', cuotas:false, grupo:'credito'}
};
function esTipoCuotas(tipo){ return (TIPOS_CREDITO[tipo]||{}).cuotas === true; }
function grupoDeTipo(tipo){ return (TIPOS_CREDITO[tipo]||{}).grupo || 'credito'; }
function tiposDeGrupo(grupo){ return Object.keys(TIPOS_CREDITO).filter(k=>TIPOS_CREDITO[k].grupo===grupo); }
let tarjetasFiltroTipo = '';
let creditosFiltroTipo = '';
function nextOccurrenceOfDay(dia){
  dia = parseInt(dia)||1;
  const hoy = new Date();
  let d = new Date(hoy.getFullYear(), hoy.getMonth(), Math.min(dia,28));
  if(dia<=28) d = new Date(hoy.getFullYear(), hoy.getMonth(), dia);
  if(d < new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate())) d.setMonth(d.getMonth()+1);
  return d;
}
function lastOccurrenceOfDay(dia){
  const prox = nextOccurrenceOfDay(dia);
  const prev = new Date(prox); prev.setMonth(prev.getMonth()-1);
  return prev;
}
function calcularGastoCicloTarjeta(t){
  if(!t.cuentaAsociada || !t.diaCorte) return null;
  const inicio = lastOccurrenceOfDay(t.diaCorte);
  const inicioISO = inicio.toISOString().slice(0,10);
  return STATE.transacciones
    .filter(tr=>tr.tipo==='egreso' && tr.cuenta===t.cuentaAsociada && tr.fecha>=inicioISO)
    .reduce((a,tr)=>a+(parseFloat(tr.monto)||0),0);
}

/* ---------------- Compras a meses (MSI) ---------------- */
function nextOccurrenceOfDayDesde(fechaBase, dia){
  dia = parseInt(dia)||1;
  const base = new Date(fechaBase+'T00:00:00');
  let d = new Date(base.getFullYear(), base.getMonth(), Math.min(dia,28));
  if(dia<=28) d = new Date(base.getFullYear(), base.getMonth(), dia);
  if(d < base) d.setMonth(d.getMonth()+1);
  return d;
}
function calcularCronogramaMSI(t, compra){
  const dia = parseInt(t.diaCorte)||1;
  const primerCorte = nextOccurrenceOfDayDesde(compra.fechaCompra, dia);
  const cuotas = [];
  for(let i=0;i<(parseInt(compra.numeroMeses)||0);i++){
    const fecha = new Date(primerCorte); fecha.setMonth(fecha.getMonth()+i);
    cuotas.push({numero:i+1, fecha: fecha.toISOString().slice(0,10), monto: parseFloat(compra.mensualidad)||0});
  }
  return cuotas;
}
function calcularCargoMSICicloActual(t){
  if(!t.diaCorte) return 0;
  const inicio = lastOccurrenceOfDay(t.diaCorte);
  const fin = nextOccurrenceOfDay(t.diaCorte);
  let total = 0;
  STATE.comprasMeses.filter(c=>c.tarjetaId===t.id).forEach(compra=>{
    calcularCronogramaMSI(t, compra).forEach(cu=>{
      const f = new Date(cu.fecha+'T00:00:00');
      if(f>=inicio && f<fin) total += cu.monto;
    });
  });
  return total;
}

      ${tiposDeGrupo('tarjeta').map(k=>`<span class="chip ${tarjetasFiltroTipo===k?'active':''}" style="cursor:pointer;" onclick="filtrarTarjetasTipo('${k}')">${TIPOS_CREDITO[k].icono} ${TIPOS_CREDITO[k].label}</span>`).join('')}

  renderGrupoGrid('credito', 'creditosGrid', creditosFiltroTipo, 'Aún no registras créditos de tienda, préstamos ni otros financiamientos. Agrega el primero con el botón de arriba — funciona para Coppel, Liverpool, préstamos personales, auto, hipoteca, etc.');

function filtrarCreditosTipo(tipo){ creditosFiltroTipo = tipo; renderCreditos(); }
function renderGrupoGrid(grupo, contId, filtroTipo, mensajeVacio){
  const cont = document.getElementById(contId);
  if(!cont) return;
  const base = STATE.tarjetas.filter(t=>grupoDeTipo(t.tipo)===grupo);
  const lista = filtroTipo? base.filter(t=>t.tipo===filtroTipo) : base;
  if(base.length===0){ cont.innerHTML = `<div class="card" style="grid-column:1/-1;"><div class="empty">${mensajeVacio}</div></div>`; return; }
  if(lista.length===0){ cont.innerHTML = '<div class="card" style="grid-column:1/-1;"><div class="empty">No tienes créditos de este tipo.</div></div>'; return; }
  cont.innerHTML = lista.map(t=>renderCreditoCard(t)).join('');
}
function renderTarjetasGrid(){
  renderGrupoGrid('tarjeta', 'tarjetasGrid', tarjetasFiltroTipo, 'Aún no registras tarjetas de crédito. Agrega la primera con el botón de arriba — funciona para tarjetas bancarias, Amex, etc.');
  renderGrupoGrid('credito', 'creditosGrid', creditosFiltroTipo, 'Aún no registras créditos de tienda, préstamos ni otros financiamientos. Agrega el primero con el botón de arriba — funciona para Coppel, Liverpool, préstamos personales, auto, hipoteca, etc.');
}
function renderCreditoCard(t){
    const info = TIPOS_CREDITO[t.tipo] || {label:'Crédito', icono:'📄', cuotas:false};
    const esGrupoTarjeta = grupoDeTipo(t.tipo)==='tarjeta';

    const tope = parseFloat(t.tope)||0;
    const cicloCalc = calcularGastoCicloTarjeta(t);
    const saldo = cicloCalc!==null ? cicloCalc : (parseFloat(t.saldoActual)||0);
    const pct = tope>0? Math.min(100,(saldo/tope*100)) : 0;
    const color = pct<60?'green':(pct<90?'yellow':'red');
    const proximoCorte = t.diaCorte? nextOccurrenceOfDay(t.diaCorte) : null;
    const proximoPago = t.diaPago? nextOccurrenceOfDay(t.diaPago) : null;
    const tasa = parseFloat(t.tasaInteres)||0;
    const interesEstimado = saldo>0 && tasa>0 ? saldo*(tasa/100) : 0;
    const disponible = Math.max(0, tope-saldo);
    const cuotas = esTipoCuotas(t.tipo);
    const numCuotas = parseInt(t.numeroCuotas)||0;
    const cuotasPagadas = parseInt(t.cuotasPagadas)||0;
    const cuotaMensual = parseFloat(t.cuotaMensual)||0;
    const cargoMSICiclo = esGrupoTarjeta ? calcularCargoMSICicloActual(t) : 0;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-weight:700;font-size:15px;">${escapeHtml(t.nombre)}</div>
          <div style="font-size:12px;color:var(--ink-soft);">${escapeHtml(t.banco||'')}</div>
          <span class="tag" style="background:var(--bg);color:var(--ink-soft);margin-top:4px;">${info.icono} ${info.label}</span>
        </div>
        <div><button class="icon-btn" onclick='editTarjeta(${JSON.stringify(t.id)})'>✎</button><button class="icon-btn" onclick='deleteTarjeta(${JSON.stringify(t.id)})'>🗑</button></div>
      </div>
      <div style="margin-top:12px;">
        <div class="mono" style="font-size:20px;font-weight:700;">${fmtMoney(saldo)}</div>
        <div style="font-size:11.5px;color:var(--ink-soft);">${cuotas?'saldo pendiente de':'usado de'} ${fmtMoney(tope)} ${cuotas?'(monto original)':'de tope'} ${cicloCalc!==null?'· calculado del ciclo actual':''}</div>
        ${cargoMSICiclo>0?`<div style="font-size:11.5px;color:var(--ink-soft);">Incluye ${fmtMoney(cargoMSICiclo)} de compras a meses este ciclo</div>`:''}
      </div>
      <div class="progress-track" style="margin:10px 0 4px;"><div class="progress-fill ${color}" style="width:${pct}%;"></div></div>
      <div style="font-size:11.5px;color:var(--ink-soft);">${pct.toFixed(0)}% ${cuotas?'pagado' : 'usado'} · ${fmtMoney(disponible)} ${cuotas?'restante':'disponible'}</div>
      ${cuotas?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">Cuotas: <b>${cuotasPagadas} de ${numCuotas||'—'}</b> · Cuota mensual: <b>${fmtMoney(cuotaMensual)}</b></div>`:''}
      <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;border-top:1px solid var(--border);padding-top:10px;">
        ${!cuotas?`<div><div style="color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;">Corte</div><div class="mono">${proximoCorte?fmtDate(proximoCorte):'—'}</div></div>`:''}
        <div><div style="color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;">${cuotas?'Próximo pago':'Límite de pago'}</div><div class="mono" style="${proximoPago && (proximoPago-new Date())/86400000<=3 ? 'color:var(--accent);font-weight:700;':''}">${proximoPago?fmtDate(proximoPago):'—'}</div></div>
        <div><div style="color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;">Interés</div><div class="mono">${tasa?tasa+'%':'—'}</div></div>
      </div>
      ${esGrupoTarjeta && saldo>0 ? `<div style="margin-top:8px;font-size:11.5px;background:var(--bg);border-radius:6px;padding:6px 9px;">Para no generar intereses, paga <b>${fmtMoney(saldo)}</b> completos antes del ${proximoPago?fmtDate(proximoPago):'límite de pago'}.</div>` : ''}
      ${!cuotas && interesEstimado>0?`<div style="margin-top:8px;font-size:11.5px;background:var(--accent-soft);color:#7A241A;border-radius:6px;padding:6px 9px;">Si no pagas el total, podrías generar ~${fmtMoney(interesEstimado)} de interés este periodo.</div>`:''}
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;">
        <button class="btn small brass" onclick='openEstadoCuentaModal(${JSON.stringify(t.id)})'>📄 Actualizar con estado de cuenta</button>
        ${cuotas?`<button class="btn small brass" onclick='registrarPagoCuota(${JSON.stringify(t.id)})'>Registrar pago de cuota</button>`:''}
        ${!cuotas && !t.cuentaAsociada?`<button class="btn small ghost" onclick='openActualizarSaldoModal(${JSON.stringify(t.id)})'>Ajuste rápido de saldo</button>`:''}
        ${esGrupoTarjeta?`<button class="btn small ghost" onclick='openDiferirCompraModal(${JSON.stringify(t.id)})'>📆 Diferir compra a meses</button>`:''}
        ${esGrupoTarjeta?`<button class="btn small ghost" onclick='openSimuladorPagoModal(${JSON.stringify(t.id)})'>🧮 Simulador de pago</button>`:''}
      </div>
      ${esGrupoTarjeta?renderComprasMesesList(t):''}
      ${renderHistorialEstadosCuenta(t.id)}
      ${t.notas?`<div style="margin-top:8px;font-size:11.5px;color:var(--ink-soft);">${escapeHtml(t.notas)}</div>`:''}
    </div>`;
}
function renderHistorialEstadosCuenta(tarjetaId){
  const historial = STATE.estadosCuenta.filter(e=>e.tarjetaId===tarjetaId).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  if(historial.length===0) return '';
  return `<details style="margin-top:10px;">
    <summary style="cursor:pointer;font-size:12px;color:var(--ink-soft);">Historial de estados de cuenta (${historial.length})</summary>
    <table class="ledger" style="margin-top:8px;"><tbody>
    ${historial.map((e,i)=>{
      const anterior = historial[i+1];
      let delta = '';
      if(anterior){
        const diff = (parseFloat(e.saldo)||0) - (parseFloat(anterior.saldo)||0);
        if(diff!==0) delta = `<span style="color:${diff>0?'var(--accent)':'var(--ink)'};font-size:11px;">${diff>0?'▲':'▼'} ${fmtMoney(Math.abs(diff))}</span>`;
      }
      return `<tr>
        <td class="mono">${fmtDate(e.fecha)}</td>
        <td class="amt">${fmtMoney(e.saldo)}</td>
        <td>${delta}</td>
        <td style="color:var(--ink-soft);">${e.pagoMinimo?'Mín: '+fmtMoney(e.pagoMinimo):''}</td>
        <td><button class="icon-btn" onclick='deleteEstadoCuenta(${JSON.stringify(e.id)},${JSON.stringify(tarjetaId)})'>🗑</button></td>
      </tr>`;
    }).join('')}
    </tbody></table>
  </details>`;
}

  const t = STATE.tarjetas.find(x=>x.id===tarjetaId);
  const body = `
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:0;">Captura los datos tal cual aparecen en tu estado de cuenta más reciente. Esto actualiza el saldo de "${escapeHtml(t.nombre)}" y queda guardado en su historial.</p>

    <div class="field"><label>Saldo al corte</label><input type="number" step="0.01" id="ecSaldo" value="${t.saldoActual||''}" placeholder="Ej. 8450.00"></div>
    <div class="field-row">
      <div class="field"><label>Pago mínimo</label><input type="number" step="0.01" id="ecPagoMinimo" placeholder="Ej. 850.00"></div>
      <div class="field"><label>Interés cobrado este periodo (opcional)</label><input type="number" step="0.01" id="ecInteres" placeholder="Ej. 120.00"></div>
    </div>
    <div class="field"><label>Notas (opcional)</label><input type="text" id="ecNotas" placeholder="Ej. Incluye compra a meses"></div>`;
  const foot = `<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick='guardarEstadoCuenta(${JSON.stringify(tarjetaId)})'>Guardar y actualizar saldo</button>`;
  openModal('Actualizar con estado de cuenta', body, foot);
}
async function guardarEstadoCuenta(tarjetaId){
  const saldo = parseFloat(document.getElementById('ecSaldo').value)||0;
  const data = {
    tarjetaId,
    fecha: document.getElementById('ecFecha').value || todayISO(),
    saldo,
    pagoMinimo: parseFloat(document.getElementById('ecPagoMinimo').value)||0,
    interesCobrado: parseFloat(document.getElementById('ecInteres').value)||0,
    notas: document.getElementById('ecNotas').value
  };
  try{
    await API.create('estadosCuenta', data);
    await API.update('tarjetas', tarjetaId, {saldoActual: saldo});
    closeModal(); toast('Estado de cuenta guardado ✓'); renderTarjetasGrid();
  }catch(e){ toast('Error: '+e.message+' — recuerda actualizar tu Apps Script con la nueva pestaña "estadosCuenta".'); }
}
async function deleteEstadoCuenta(id, tarjetaId){
  if(!confirm('¿Eliminar este registro del historial?')) return;
  await API.remove('estadosCuenta', id);
  toast('Eliminado'); renderTarjetasGrid();
}

/* ---------------- Diferir compra a meses (MSI) ---------------- */
function renderComprasMesesList(t){
  const compras = STATE.comprasMeses.filter(c=>c.tarjetaId===t.id);
  if(compras.length===0) return '';
  const hoy = new Date();
  return `<div style="margin-top:10px;">
    <div style="font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;">Compras a meses activas</div>
    ${compras.map(c=>{
      const cronograma = calcularCronogramaMSI(t, c);
      const pagadas = cronograma.filter(cu=>new Date(cu.fecha+'T00:00:00')<=hoy).length;
      const total = cronograma.length;
      const proxima = cronograma.find(cu=>new Date(cu.fecha+'T00:00:00')>hoy);
      const terminada = pagadas>=total;
      return `<div style="border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px;">
        <div style="display:flex;justify-content:space-between;">
          <span><b>${escapeHtml(c.descripcion||'Compra a meses')}</b> — ${fmtMoney(c.montoTotal)} a ${c.numeroMeses} meses</span>
          <button class="icon-btn" onclick='deleteCompraMeses(${JSON.stringify(c.id)},${JSON.stringify(t.id)})'>🗑</button>
        </div>
        <div class="progress-track" style="margin:6px 0 4px;height:6px;"><div class="progress-fill green" style="width:${Math.min(100,pagadas/total*100)}%;"></div></div>
        <div style="color:var(--ink-soft);">${terminada?'Liquidada ✓' : `Cuota ${pagadas+1} de ${total} · ${fmtMoney(c.mensualidad)}/mes${proxima?' · próximo cargo '+fmtDate(proxima.fecha):''}`}</div>
      </div>`;
    }).join('')}
  </div>`;
}
function openDiferirCompraModal(tarjetaId){
  const t = STATE.tarjetas.find(x=>x.id===tarjetaId);
  if(!t.diaCorte){ toast('Primero configura el "Día de corte" de esta tarjeta (editar tarjeta) para poder proyectar los ciclos.'); return; }
  const body = `
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:0;">Desglosa una compra en mensualidades iguales y las asigna automáticamente a los próximos ciclos de "${escapeHtml(t.nombre)}".</p>
    <div class="field"><label>Descripción</label><input type="text" id="dcDescripcion" placeholder="Ej. Laptop, viaje, muebles"></div>
    <div class="field-row">
      <div class="field"><label>Monto total de la compra</label><input type="number" step="0.01" id="dcMonto" value="12000" oninput="actualizarPreviewMSI()"></div>
      <div class="field"><label>Número de meses</label>
        <select id="dcMeses" onchange="actualizarPreviewMSI()">
          ${[3,6,9,12,15,18,24].map(n=>`<option value="${n}" ${n===12?'selected':''}>${n} meses</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field"><label>Fecha de compra</label><input type="date" id="dcFecha" value="${todayISO()}" oninput="actualizarPreviewMSI()"></div>
    <div id="previewMSI" style="font-size:12.5px;background:var(--bg);border-radius:6px;padding:8px 10px;color:var(--ink-soft);"></div>`;
  const foot = `<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick='guardarDiferirCompra(${JSON.stringify(tarjetaId)})'>Diferir compra</button>`;
  openModal('Diferir compra a meses', body, foot);

function actualizarPreviewMSI(){
  const prev = document.getElementById('previewMSI');
  if(!prev) return;
  const monto = parseFloat(document.getElementById('dcMonto').value)||0;
  const meses = parseInt(document.getElementById('dcMeses').value)||1;
  const mensualidad = monto/meses;
  prev.innerHTML = `Se crearán <b>${meses} cargos de ${fmtMoney(mensualidad)}</b> cada uno, uno por ciclo, empezando en el corte que sigue a la fecha de compra.`;
}
async function guardarDiferirCompra(tarjetaId){
  const monto = parseFloat(document.getElementById('dcMonto').value)||0;
  const meses = parseInt(document.getElementById('dcMeses').value)||1;
  if(monto<=0){ toast('Ingresa un monto válido'); return; }
  const data = {
    tarjetaId,
    descripcion: document.getElementById('dcDescripcion').value,
    montoTotal: monto,
    numeroMeses: meses,
    mensualidad: Math.round((monto/meses)*100)/100,
    fechaCompra: document.getElementById('dcFecha').value || todayISO()
  };
  try{
    await API.create('comprasMeses', data);
    closeModal(); toast('Compra diferida a '+meses+' meses ✓'); renderTarjetasGrid();
  }catch(e){ toast('Error: '+e.message+' — recuerda actualizar tu Apps Script con la nueva pestaña "comprasMeses".'); }
}
async function deleteCompraMeses(id, tarjetaId){
  if(!confirm('¿Eliminar esta compra a meses? Ya no se proyectarán sus cargos futuros.')) return;
  await API.remove('comprasMeses', id);
  toast('Eliminada'); renderTarjetasGrid();
}

/* ---------------- Simulador de pago / intereses ---------------- */
function openSimuladorPagoModal(tarjetaId){
  const t = STATE.tarjetas.find(x=>x.id===tarjetaId);
  const cicloCalc = calcularGastoCicloTarjeta(t);
  const saldo = cicloCalc!==null ? cicloCalc : (parseFloat(t.saldoActual)||0);
  const ultimoEstado = STATE.estadosCuenta.filter(e=>e.tarjetaId===tarjetaId).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0];
  const pagoMinimo = ultimoEstado? parseFloat(ultimoEstado.pagoMinimo)||0 : 0;
  const proximoPago = t.diaPago? nextOccurrenceOfDay(t.diaPago) : null;
  const body = `
    <div style="font-size:12.5px;background:var(--bg);border-radius:6px;padding:10px 12px;margin-bottom:14px;">
      <div>Saldo actual: <b class="mono">${fmtMoney(saldo)}</b></div>
      <div>Tasa de interés mensual: <b>${t.tasaInteres?t.tasaInteres+'%':'no capturada'}</b></div>
      ${pagoMinimo>0?`<div>Pago mínimo (último estado de cuenta): <b class="mono">${fmtMoney(pagoMinimo)}</b></div>`:''}
      <div>Fecha límite de pago: <b>${proximoPago?fmtDate(proximoPago):'—'}</b></div>
    </div>
    <div class="field"><label>¿Cuánto planeas pagar?</label><input type="number" step="0.01" id="simPago" value="${saldo}" oninput='actualizarSimuladorPago(${JSON.stringify(tarjetaId)})'></div>
    ${pagoMinimo>0?`<div class="chip-row" style="margin-bottom:10px;">
      <span class="chip" style="cursor:pointer;" onclick='document.getElementById("simPago").value=${pagoMinimo};actualizarSimuladorPago(${JSON.stringify(tarjetaId)})'>Usar pago mínimo (${fmtMoney(pagoMinimo)})</span>
      <span class="chip" style="cursor:pointer;" onclick='document.getElementById("simPago").value=${saldo};actualizarSimuladorPago(${JSON.stringify(tarjetaId)})'>Usar saldo total (${fmtMoney(saldo)})</span>
    </div>`:''}
    <div id="simResultado"></div>
    <div style="font-size:11px;color:var(--ink-faint);margin-top:10px;">Cálculo estimado con interés simple sobre el saldo no pagado. Tu banco puede calcularlo distinto (interés sobre saldo promedio diario, comisiones, IVA sobre intereses, etc.) — úsalo como referencia, no como cifra exacta.</div>`;
  const foot = `<button class="btn ghost" onclick="closeModal()">Cerrar</button>`;
  openModal('Simulador de pago — '+t.nombre, body, foot);
  actualizarSimuladorPago(tarjetaId);
}
function actualizarSimuladorPago(tarjetaId){
  const t = STATE.tarjetas.find(x=>x.id===tarjetaId);
  const cicloCalc = calcularGastoCicloTarjeta(t);
  const saldo = cicloCalc!==null ? cicloCalc : (parseFloat(t.saldoActual)||0);
  const tasa = parseFloat(t.tasaInteres)||0;
  const pago = parseFloat(document.getElementById('simPago').value)||0;
  const pendiente = Math.max(0, saldo-pago);
  const interes = pendiente>0? pendiente*(tasa/100) : 0;
  const cont = document.getElementById('simResultado');
  if(pago>=saldo){
    cont.innerHTML = `<div style="font-size:13px;background:var(--bg);border-radius:6px;padding:10px 12px;">✅ <b>No generarías intereses</b> — estás pagando el saldo completo.</div>`;
  }else{
    cont.innerHTML = `<div style="font-size:13px;background:var(--accent-soft);color:#7A241A;border-radius:6px;padding:10px 12px;">
      ⚠️ Quedarían <b>${fmtMoney(pendiente)}</b> sin pagar.<br>
      Interés estimado del próximo periodo: <b>~${fmtMoney(interes)}</b>${!tasa?' (captura la tasa de interés en la tarjeta para calcularlo)':''}.
    </div>`;
  }
}

function aplicarPresetEmisor(p){
  document.getElementById('tNombre').value = p.nombre;
  document.getElementById('tBanco').value = p.banco;
  document.getElementById('tTipo').value = p.tipo;
  toggleCamposTipoCredito();
  toast(p.nombre+' aplicado — completa el resto de los datos');
}
function actualizarPreviewTarjeta(){
  const prev = document.getElementById('previewTarjeta');
  if(!prev) return;
  const tipo = document.getElementById('tTipo').value;
  const cuotas = esTipoCuotas(tipo);
  const tope = parseFloat(document.getElementById('tTope').value)||0;
  const saldo = parseFloat((cuotas? document.getElementById('tSaldoCuotas') : document.getElementById('tSaldo')).value)||0;
  if(tope<=0){ prev.textContent=''; return; }
  const pct = Math.min(100, (saldo/tope*100));
  prev.textContent = `Con estos datos usarías ${pct.toFixed(0)}% de ${fmtMoney(tope)} → ${fmtMoney(Math.max(0,tope-saldo))} disponible.`;
}
function toggleCamposTipoCredito(){
  const tipo = document.getElementById('tTipo').value;
  const cuotas = esTipoCuotas(tipo);
  document.getElementById('camposRevolvente').style.display = cuotas? 'none':'block';
  document.getElementById('camposCuotas').style.display = cuotas? 'block':'none';
  document.getElementById('tTopeLabel').textContent = cuotas? 'Monto original del crédito':'Tope / línea de crédito';
  actualizarPreviewTarjeta();
}
async function saveTarjeta(id){

  const tipo = document.getElementById('tTipo').value;
  const cuotas = esTipoCuotas(tipo);
  const data = {
    nombre: document.getElementById('tNombre').value,
    banco: document.getElementById('tBanco').value,
    tipo,
    tope: parseFloat(document.getElementById('tTope').value)||0,
    tasaInteres: parseFloat(document.getElementById('tTasa').value)||0,
    notas: document.getElementById('tNotas').value
  };
  if(cuotas){
    Object.assign(data, {
      diaCorte: '',
      diaPago: parseInt(document.getElementById('tDiaPagoCuota').value)||'',
      cuentaAsociada: '',
      saldoActual: parseFloat(document.getElementById('tSaldoCuotas').value)||0,
      numeroCuotas: parseInt(document.getElementById('tNumCuotas').value)||0,
      cuotaMensual: parseFloat(document.getElementById('tCuotaMensual').value)||0,
      cuotasPagadas: parseInt(document.getElementById('tCuotasPagadas').value)||0
    });
  }else{
    Object.assign(data, {
      diaCorte: parseInt(document.getElementById('tDiaCorte').value)||'',
      diaPago: parseInt(document.getElementById('tDiaPago').value)||'',
      cuentaAsociada: document.getElementById('tCuenta').value,
      saldoActual: parseFloat(document.getElementById('tSaldo').value)||0,
      numeroCuotas: '', cuotaMensual: '', cuotasPagadas: ''
    });
  }
  if(!data.nombre){ toast('Ponle nombre a la tarjeta o crédito'); return; }
  try{
    if(id) await API.update('tarjetas', id, data); else await API.create('tarjetas', data);
    closeModal(); toast('Guardado ✓'); renderTarjetasGrid();
  }catch(e){ toast('Error: '+e.message+' — recuerda actualizar tu Apps Script y agregar las columnas nuevas a la pestaña "tarjetas".'); }
}

async function guardarPagoCuota(id){
  const t = STATE.tarjetas.find(x=>x.id===id);
  const monto = parseFloat(document.getElementById('pcMonto').value)||0;
  if(monto<=0){ toast('Ingresa un monto válido'); return; }
  const nuevoSaldo = Math.max(0, (parseFloat(t.saldoActual)||0) - monto);
  const nuevasCuotasPagadas = (parseInt(t.cuotasPagadas)||0) + 1;
  let nuevaFechaPago = t.diaPago;
  await API.update('tarjetas', id, {saldoActual: nuevoSaldo, cuotasPagadas: nuevasCuotasPagadas});
  closeModal(); toast('Pago registrado ✓'); renderTarjetasGrid();
}

let repFilters = {desde:'', hasta:'', categoria:'', cuenta:''};
function renderReportes(){
  const el = document.getElementById('sec-reportes');
  const hoy = todayISO();
  const inicioMes = hoy.slice(0,8)+'01';
  if(!repFilters.desde) repFilters.desde = inicioMes;

      </div>

        <div class="field" style="min-width:140px;"><label>Hasta</label><input type="date" id="rHasta" value="${repFilters.hasta}"></div>
        <div class="field" style="min-width:150px;"><label>Categoría</label><select id="rCategoria"><option value="">Todas</option>${STATE.categorias.map(c=>`<option value="${escapeHtml(c.nombre)}">${escapeHtml(c.nombre)}</option>`).join('')}</select></div>
        <div class="field" style="min-width:140px;"><label>Cuenta</label><select id="rCuenta"><option value="">Todas</option>${STATE.cuentas.map(c=>`<option value="${escapeHtml(c.nombre)}">${escapeHtml(c.nombre)}</option>`).join('')}</select></div>
        <div class="field" style="display:flex;align-items:flex-end;"><button class="btn" onclick="applyReportFilters()">Aplicar filtros</button></div>
      </div>
    </div>
    <div id="reportOutput"></div>`;
  applyReportFilters();
}
function reportRows(){
  return STATE.transacciones.filter(t=>{
    if(repFilters.desde && t.fecha < repFilters.desde) return false;
    if(repFilters.hasta && t.fecha > repFilters.hasta) return false;
    if(repFilters.categoria && t.categoria !== repFilters.categoria) return false;
    if(repFilters.cuenta && t.cuenta !== repFilters.cuenta) return false;
    return true;
  });
}
function applyReportFilters(){
  repFilters.desde = document.getElementById('rDesde').value;
  repFilters.hasta = document.getElementById('rHasta').value;
  repFilters.categoria = document.getElementById('rCategoria').value;
  repFilters.cuenta = document.getElementById('rCuenta').value;
  const rows = reportRows().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const ing = rows.filter(t=>t.tipo==='ingreso').reduce((a,t)=>a+(parseFloat(t.monto)||0),0);
  const egr = rows.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+(parseFloat(t.monto)||0),0);

  // periodo anterior de igual longitud, para tendencia
  const d1 = new Date(repFilters.desde), d2 = new Date(repFilters.hasta);
  const diasRango = Math.max(1, Math.round((d2-d1)/86400000)+1);
  const prevHasta = new Date(d1); prevHasta.setDate(prevHasta.getDate()-1);
  const prevDesde = new Date(prevHasta); prevDesde.setDate(prevDesde.getDate()-diasRango+1);
  const prevRows = STATE.transacciones.filter(t=>t.fecha>=prevDesde.toISOString().slice(0,10) && t.fecha<=prevHasta.toISOString().slice(0,10));
  const prevEgr = prevRows.filter(t=>t.tipo==='egreso').reduce((a,t)=>a+(parseFloat(t.monto)||0),0);
  const cambioEgr = prevEgr>0? ((egr-prevEgr)/prevEgr*100) : (egr>0?100:0);

  document.getElementById('reportOutput').innerHTML = `
    <div class="grid grid-3" style="margin-bottom:16px;">
      <div class="card"><div class="stat-label">Ingresos del periodo</div><div class="stat-value pos mono">${fmtMoney(ing)}</div></div>
      <div class="card"><div class="stat-label">Egresos del periodo</div><div class="stat-value neg mono">${fmtMoney(egr)}</div>
        <div class="stat-sub">vs. periodo anterior <span class="trend ${cambioEgr>=0?'up':'down'}">${cambioEgr>=0?'▲':'▼'} ${Math.abs(cambioEgr).toFixed(1)}%</span></div></div>
      <div class="card"><div class="stat-label">Balance neto del periodo</div><div class="stat-value ${ing-egr>=0?'pos':'neg'} mono">${fmtMoney(ing-egr)}</div></div>
    </div>
    <div class="card" id="printArea">
      <div class="stat-label">Detalle (${rows.length} movimientos)</div>
      ${rows.length===0? '<div class="empty">No hay movimientos en este rango.</div>' : `
      <table class="ledger"><thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Cuenta</th><th>Nota</th><th style="text-align:right;">Monto</th></tr></thead><tbody>
      ${rows.map(t=>`<tr><td class="mono">${fmtDate(t.fecha)}</td><td>${t.tipo==='ingreso'?'Ingreso':'Egreso'}</td><td>${escapeHtml(t.categoria)}</td><td>${escapeHtml(t.cuenta)}</td><td style="color:var(--ink-soft);">${escapeHtml(t.nota||'')}</td><td class="amt ${t.tipo==='ingreso'?'pos':'neg'}" style="text-align:right;">${fmtMoney(t.monto)}</td></tr>`).join('')}
      </tbody></table>`}
    </div>`;
}
function exportarCSV(){
  const rows = reportRows();
  if(rows.length===0){ toast('No hay datos para exportar'); return; }
  const headers = ['Fecha','Tipo','Categoría','Cuenta','Nota','Monto'];
  const csvRows = [headers.join(',')].concat(rows.map(t=>[t.fecha,t.tipo,`"${(t.categoria||'').replace(/"/g,'""')}"`,`"${(t.cuenta||'').replace(/"/g,'""')}"`,`"${(t.nota||'').replace(/"/g,'""')}"`,t.monto].join(',')));
  const blob = new Blob(["\uFEFF"+csvRows.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `reporte-libro-mayor-${repFilters.desde}-a-${repFilters.hasta}.csv`;
  a.click();
  toast('CSV descargado ✓');
}

async function testAndSaveApiUrl(){
  const url = document.getElementById('apiUrlInput').value.trim();
  if(!url){ toast('Ingresa una URL'); return; }
  toast('Probando conexión...');
  const ok = await API.ping(url);
  STATE.apiUrl = url;
  await saveConfig();
  if(ok){ toast('Conectado ✓ Sincronizando...'); await syncFromSheets(true); renderAjustes(); showSection('ajustes'); }
  else{ toast('No se pudo conectar. Revisa la URL y que el acceso sea "Cualquier usuario".'); setSyncStatus(false); }
}

/* ---------------- Recordatorios por correo ---------------- */
async function cargarEstadoRecordatorios(){
  const cont = document.getElementById('recordatoriosStatus');
  if(!cont) return;
  try{
    const res = await fetch(STATE.apiUrl + '?action=estadoRecordatorios');
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'Error');
    const info = j.data;
    document.getElementById('recEmail').value = info.email || '';
    document.getElementById('recDias').value = String(info.diasAviso || 3);
    cont.innerHTML = info.activo
      ? `<span class="stamp pagado">Activos</span> Enviando a <b>${escapeHtml(info.email)}</b> cada mañana, avisando con ${info.diasAviso} día(s) de anticipación.`
      : `<span class="stamp pendiente">Inactivos</span> Aún no activas los recordatorios diarios.`;
  }catch(e){
    cont.innerHTML = `No se pudo consultar el estado. Asegúrate de haber actualizado tu Apps Script con las funciones de recordatorios.`;
  }
}
async function activarRecordatorios(){
  const email = document.getElementById('recEmail').value.trim();
  const dias = document.getElementById('recDias').value;
  if(!email){ toast('Ingresa un correo destino'); return; }
  toast('Activando...');
  try{
    const res = await fetch(STATE.apiUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'activarRecordatorios', email, diasAviso:dias})});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'Error');
    toast('Recordatorios activados ✓'); cargarEstadoRecordatorios();
  }catch(e){ toast('Error: '+e.message); }
}
async function desactivarRecordatoriosUI(){
  toast('Desactivando...');
  try{
    const res = await fetch(STATE.apiUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'desactivarRecordatorios'})});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'Error');
    toast('Recordatorios desactivados'); cargarEstadoRecordatorios();
  }catch(e){ toast('Error: '+e.message); }
}
async function probarRecordatorio(){
  toast('Enviando correo de prueba...');
  try{
    const res = await fetch(STATE.apiUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'probarRecordatorio'})});
    const j = await res.json();
    if(!j.ok) throw new Error(j.error||'Error');
    toast(j.data.enviado? `Correo enviado a ${j.data.destinatario} ✓` : 'Sin pendientes que avisar');
  }catch(e){ toast('Error: '+e.message+' — actualiza tu Apps Script con las funciones de recordatorios.'); }
}

  closeModal(); toast('Cuenta guardada ✓'); renderCuentasList();

function exportarBackupJSON(){
  const data = {}; ENTIDADES.forEach(e=>data[e]=STATE[e]);
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'libro-mayor-backup-'+todayISO()+'.json'; a.click();
  toast('Copia exportada ✓');
}
function importarBackupJSON(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('Esto agregará los registros del archivo a tus datos actuales. ¿Continuar?')) return;
      for(const entity of ENTIDADES){
        if(Array.isArray(data[entity])){
          for(const row of data[entity]){ const copy = Object.assign({}, row); delete copy.id; await API.create(entity, copy); }
        }
      }
      toast('Importación completa ✓'); renderAjustes();
    }catch(err){ toast('Archivo inválido'); }
  };
  reader.readAsText(file);
}

/* ---------------- PWA: service worker + estado de conexión ----------------
   El registro falla silenciosamente si sw.js no está hospedado junto a este
   archivo (por ejemplo dentro de la vista previa de Claude.ai) — no rompe nada. */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* no disponible en este entorno */ });
  });
}
window.addEventListener('online', ()=>{ toast('Conexión recuperada, sincronizando...'); syncFromSheets(true); });
window.addEventListener('offline', ()=>{ toast('Sin conexión a internet'); });
window.addEventListener('unhandledrejection', (ev)=>{
  console.error('Error no capturado:', ev.reason);
  toast('Ocurrió un error inesperado guardando los datos. Intenta de nuevo o revisa tu conexión.');
});
